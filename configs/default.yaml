# Default configuration for IWSLT 2015 EN-VI

# Data
direction: vi2en
max_src_len: 150
max_tgt_len: 150
vocab_size: 8000
shared_vocab: true

# Model
embed_dim: 256
hidden_size: 512
num_layers: 1
cell_type: lstm
attention_type: none
bidirectional: false
dropout: 0.1

# Training
num_epochs: 15
learning_rate: 1.0e-4
batch_size: 64
gradient_accumulation_steps: 1
label_smoothing: 0.1
warmup_ratio: 0.1
max_grad_norm: 1.0
optimizer_type: adam
early_stopping_patience: 12
num_beams: 1
seed: 42
num_workers: 2

# Logging
save_steps: 500
logging_steps: 500

# W&B
wandb_enabled: true
wandb_project: iwslt2015-en-vi_framework
